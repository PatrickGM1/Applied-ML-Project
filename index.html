<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>aml.guba.dev</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <div class="hero">
        <div class="hero-domain">
          <a href="https://aml.guba.dev"
            >aml<span class="hero-slash">.</span>guba<span class="hero-slash"
              >.</span
            >dev</a
          >
        </div>
        <p>Applied Machine Learning project</p>
        <p class="hero-sub">
          Fake News Detection -
          <a
            href="https://www.kaggle.com/datasets/doanquanvietnamca/liar-dataset"
            target="_blank"
            rel="noopener noreferrer"
            >LIAR Dataset</a
          >
        </p>
      </div>

      <section>
        <span class="section-label">API</span>
        <div class="links">
          <a
            id="health-link"
            href="/health"
            target="_blank"
            rel="noopener noreferrer"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="10" />
              <polyline points="12 8 12 12 14 14" />
            </svg>
            Test endpoint
          </a>
          <a
            id="docs-link"
            href="/docs"
            target="_blank"
            rel="noopener noreferrer"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
              />
              <polyline points="14 2 14 8 20 8" />
              <line x1="16" y1="13" x2="8" y2="13" />
              <line x1="16" y1="17" x2="8" y2="17" />
            </svg>
            Swagger UI
          </a>
        </div>
      </section>

      <section>
        <span class="section-label">Demo</span>
        <div class="links">
          <a id="demo-link" href="/demo" rel="noopener noreferrer">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polygon points="5 3 19 12 5 21 5 3" />
            </svg>
            Test base model
          </a>
        </div>
      </section>

      <footer>© 2026 <a href="https://guba.dev">guba.dev</a></footer>
    </div>

    <script>
      const healthLink = document.getElementById("health-link");
      const docsLink = document.getElementById("docs-link");
      const demoLink = document.getElementById("demo-link");

      function getAppBasePath() {
        const path = window.location.pathname;
        return path.startsWith("/demo/") ? "/demo" : "";
      }

      function getApiBaseUrl() {
        const configured = window.localStorage.getItem("API_BASE_URL");
        if (configured && configured.trim()) {
          return configured.trim().replace(/\/$/, "");
        }
        if (window.location.protocol === "file:") {
          return "http://127.0.0.1:8000";
        }
        return `${window.location.origin.replace(/\/$/, "")}${getAppBasePath()}`;
      }

      const API_BASE_URL = getApiBaseUrl();
      const APP_BASE_PATH = getAppBasePath();
      healthLink.href = `${API_BASE_URL}/health`;
      docsLink.href = `${API_BASE_URL}/docs`;
      demoLink.href = APP_BASE_PATH ? `${APP_BASE_PATH}/demo` : "/demo";
    </script>
  </body>
</html>
