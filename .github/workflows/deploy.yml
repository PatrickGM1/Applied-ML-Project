name: Deploy aml.guba.dev
on:
  push:
    branches: [main, develop]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install Docker on server (if missing)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            if ! command -v docker &> /dev/null; then
              apt-get update -qq
              apt-get install -y -qq docker.io docker-compose-plugin
              systemctl enable docker
              systemctl start docker
              hash -r
            fi

      - name: Pull latest code
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GITHUB_REF_NAME,GITHUB_TOKEN
          script: |
            APP_DIR=/var/www/html/aml_html
            mkdir -p $APP_DIR
            git config --global --add safe.directory $APP_DIR

            if [ ! -d "$APP_DIR/.git" ]; then
              cd $APP_DIR
              git init
              git remote add origin https://github.com/PatrickGM1/Applied-ML-Project.git
            fi

            cd $APP_DIR
            git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/PatrickGM1/Applied-ML-Project.git
            git fetch --all
            git reset --hard origin/${GITHUB_REF_NAME}

      - name: Deploy containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker compose -f /var/www/html/aml_html/docker-compose.yml up --build -d
