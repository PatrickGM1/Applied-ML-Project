name: Deploy aml.guba.dev
on:
  push:
    branches: [main, develop]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GITHUB_REF_NAME,GITHUB_TOKEN
          script: |
            APP_DIR=/var/www/html/aml_html

            # Install Docker if not present
            if ! command -v docker &> /dev/null; then
              apt-get update -qq
              apt-get install -y -qq docker.io docker-compose-plugin
              systemctl enable docker
              systemctl start docker
              hash -r
            fi

            mkdir -p $APP_DIR

            if [ ! -d "$APP_DIR/.git" ]; then
              cd $APP_DIR
              git init
              git remote add origin https://github.com/PatrickGM1/Applied-ML-Project.git
            fi

            git config --global --add safe.directory $APP_DIR

            cd $APP_DIR
            git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/PatrickGM1/Applied-ML-Project.git
            git fetch --all
            git reset --hard origin/${GITHUB_REF_NAME}

            docker ps -q --filter "publish=8501" | xargs -r docker stop
            docker compose -f $APP_DIR/docker-compose.yml down --remove-orphans
            docker compose -f $APP_DIR/docker-compose.yml build --no-cache
            docker compose -f $APP_DIR/docker-compose.yml up -d
